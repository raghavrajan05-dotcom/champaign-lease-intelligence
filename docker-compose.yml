services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lease
      POSTGRES_PASSWORD: lease
      POSTGRES_DB: leases
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  pgdata:
  