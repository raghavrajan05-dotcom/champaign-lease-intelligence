name: Daily scrape

on:
  schedule:
    - cron: "17 12 * * *"   # 12:17 UTC = 6:17 AM Central
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas

      - name: Restore earlier scrapes and the geocode cache
        run: |
          if git fetch -q origin data 2>/dev/null; then
            git archive origin/data data | tar -x
            git archive origin/data reference 2>/dev/null | tar -x || true
          fi

      - name: Scrape Community Property Management
        continue-on-error: true
        run: >
          python -m src.scrapers.appfolio
          --base-url https://campuspm.appfolio.com
          --manager "Community Property Management"

      # Green Street Realty is scraped from Rod's laptop (scripts/scrape_greenstreet_local.sh),
      # with their permission: their site returns 403 to GitHub's servers.
      # This job keeps those files when it saves to the data branch.

      - name: Scrape JSM Living
        continue-on-error: true
        run: python -m src.scrapers.jsm

      - name: Scrape Ramshaw Real Estate
        continue-on-error: true
        run: >
          python -m src.scrapers.appfolio
          --base-url https://ram.appfolio.com
          --manager "Ramshaw Real Estate"

      - name: Scrape Weiner Companies
        continue-on-error: true
        run: >
          python -m src.scrapers.appfolio
          --base-url https://weinercompanies.appfolio.com
          --manager "Weiner Companies"

      - name: Scrape Roland Realty
        continue-on-error: true
        run: python -m src.scrapers.roland

      - name: Scrape MHM Properties
        continue-on-error: true
        run: python -m src.scrapers.mhm

      - name: Scrape Smile Student Living
        continue-on-error: true
        run: python -m src.scrapers.appfolio_feed

      - name: Scrape Octave, Seven07 and The Rive
        continue-on-error: true
        run: |
          python -m src.scrapers.floorplans octave || true
          python -m src.scrapers.floorplans seven07 || true
          python -m src.scrapers.floorplans the-rive || true

      - name: Geocode new addresses
        continue-on-error: true
        run: python -m src.geo.geocode

      - name: Data quality checks
        id: quality
        continue-on-error: true    # still save the data, then flag the run below
        run: python -m src.quality

      - name: Save results to the data branch
        # Public: CSVs, newest file per manager (latest/), geocode cache.
        # Raw HTML pages are NOT published.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="$RUNNER_TEMP/scrape"
          mkdir -p "$OUT/latest"
          cp -r data reference "$OUT/"
          for p in community-property-management green-street-realty jsm-living ramshaw-real-estate weiner-companies roland-realty mhm-properties smile-student-living octave seven07 the-rive; do
            f=$(ls data/${p}_*.csv 2>/dev/null | sort | tail -1)
            if [ -n "$f" ]; then cp "$f" "$OUT/latest/$p.csv"; fi
          done
          if git fetch -q origin data:data 2>/dev/null; then
            git checkout -q -f data
          else
            git checkout -q --orphan data
            git rm -rq --cached .
          fi
          git clean -fdxq
          git rm -rq --ignore-unmatch raw
          cp -r "$OUT/data" "$OUT/reference" "$OUT/latest" .
          git add data reference latest
          git commit -qm "Daily scrape $(date -u +%F)" || echo "Nothing new to save"
          git push -q origin data

      - name: Flag failed quality checks
        if: steps.quality.outcome == 'failure'
        run: |
          echo "Data quality checks failed. See the 'Data quality' table in this run's summary."
          exit 1
